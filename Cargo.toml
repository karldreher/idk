[package]
name = "id3-knife"
version = "0.1.0"
edition = "2024"
description = "The ID3 Knife, CLI tool for MP3 metadata edits"
license = "MIT"
repository = "https://github.com/karldreher/idk"
readme = "README.md"

[[bin]]
name = "idk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
id3 = { version = "1.17", default-features = false }
indicatif = "0.18"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
